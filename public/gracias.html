<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tu cita · {{nombre}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<style>:root { --gold: {{acento}}; --gold-light: {{acentoClaro}}; --gold-dark: {{acentoOscuro}}; }</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="brand">{{{marcaHtml}}}</div></div></header>
<main class="wrap" style="max-width:480px">
  <section class="card" style="margin-top:40px; text-align:center">
    <div style="font-size:3rem">✂️</div>
    <h1 style="text-transform:uppercase" id="titulo">Tu cita</h1>
    <p class="muted" id="sub">Verificando tu pago…</p>
    <dl class="summary" id="resumen" style="text-align:left; margin-top:20px"></dl>
    <div id="code" class="hidden"><div class="msg ok">Tu código de cita: <b id="codigo-txt"></b></div></div>
    <p class="muted hidden" id="mail-nota">Te enviamos la confirmación a tu correo. ¡Te esperamos!</p>
    <a class="btn ghost" href="index.html" style="margin-top:10px">Agendar otra cita</a>
  </section>
</main>
<script nonce="{{nonce}}">
const params = new URLSearchParams(location.search);
const money = (n) => '$' + Number(n) + ' MXN';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const titulo = (t) => { document.getElementById('titulo').textContent = t; };
const codigo = (c) => {
  document.getElementById('codigo-txt').textContent = c.codigo;
  document.getElementById('code').classList.remove('hidden');
};
function pinta(c) {
  titulo('¡Cita confirmada!');
  const f = new Date(c.fecha + 'T12:00:00').toLocaleDateString('es-MX', { weekday:'long', day:'numeric', month:'long' });
  document.getElementById('sub').textContent = '¡Nos vemos pronto, ' + c.cliente + '!';
  document.getElementById('resumen').innerHTML = `
    <dt>Servicio</dt><dd>${esc(c.servicio)}</dd>
    <dt>Barbero</dt><dd>${esc(c.barbero)}</dd>
    <dt>Día</dt><dd style="text-transform:capitalize">${esc(f)}</dd>
    <dt>Hora</dt><dd>${esc(c.hora)} (${Number(c.duracion)} min)</dd>
    <dt>Pagado</dt><dd>${money(c.precio)}</dd>`;
  codigo(c);
  document.getElementById('mail-nota').classList.remove('hidden');
}
async function run() {
  try {
    // Mercado Pago regresa con payment_id (o collection_id) y status en la URL
    const pid = params.get('payment_id') || params.get('collection_id');
    const estadoMP = params.get('status') || params.get('collection_status');
    let c, r;
    if (pid) {
      const q = new URLSearchParams({ payment_id: pid, preference_id: params.get('preference_id') || '' });
      r = await fetch('/api/reservas/confirmar?' + q);
      c = await r.json();
    } else if (params.get('codigo')) {
      c = await (await fetch('/api/demo/' + encodeURIComponent(params.get('codigo')))).json();
    }
    if (c && c.codigo && c.estado === 'conflicto') {
      // Pagó, pero el horario se ocupó mientras pagaba: la barbería lo contacta
      titulo('Recibimos tu pago');
      document.getElementById('sub').textContent = 'Pero ese horario se ocupó mientras pagabas. Te contactaremos para reagendar tu cita o devolverte tu dinero.';
      codigo(c);
    } else if (c && c.codigo && (c.estado === 'pagada' || (!r) || r.ok)) {
      pinta(c);
    } else if (estadoMP === 'pending' || estadoMP === 'in_process' || (c && c.estado && c.estado !== 'pagada')) {
      // Pagos como OXXO o SPEI quedan pendientes hasta que se acreditan
      titulo('Pago en proceso');
      document.getElementById('sub').textContent = 'En cuanto se acredite tu pago, tu cita quedará confirmada y te llegará el correo.';
      if (c && c.codigo) codigo(c);
    } else {
      titulo('No encontramos tu cita');
      document.getElementById('sub').textContent = 'No pudimos encontrar tu cita. Revisa tu correo o contáctanos.';
    }
  } catch { titulo('Tu cita'); document.getElementById('sub').textContent = 'Hubo un problema al confirmar. Revisa tu correo.'; }
}
run();
</script>
</body>
</html>
